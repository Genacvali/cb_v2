<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CrystalBudget — Управление бюджетом</title>
    <meta name="description" content="CrystalBudget — приложение для умного распределения доходов по категориям расходов" />
    <meta name="author" content="CrystalBudget" />
    <meta name="theme-color" content="#5b3df5" />

    <meta property="og:title" content="CrystalBudget — Управление бюджетом" />
    <meta property="og:description" content="CrystalBudget — приложение для умного распределения доходов по категориям расходов" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@CrystalBudget" />
    <meta name="twitter:image" content="/favicon.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Fonts: preconnect + non-blocking stylesheet instead of a render-blocking CSS @import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!-- Apply the saved theme before first paint to avoid a white flash on dark themes -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('crystalbudget-theme');
          var themes = ['light', 'dark', 'night', 'pink', 'ebony'];
          document.documentElement.classList.add(themes.indexOf(t) !== -1 ? t : 'light');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
